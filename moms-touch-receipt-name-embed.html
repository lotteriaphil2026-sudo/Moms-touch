<!-- MOM’S TOUCH ADD FUNDS RECEIPT - embed into the existing dashboard immediately before </body>.
After your Done handler successfully saves the request, pass its real server-returned fields:

const saved = await saveAddFundsRequest({amount,bank:selectedBank});
MomsTouchReceipt.show({
 amount:saved.amount, bank:saved.bank, fee:saved.fee ?? 0,
 referenceNumber:saved.referenceNumber, createdAt:saved.createdAt,
 status:saved.status // pending by default; completed only after verified payment
});

Do not display a successful/paid receipt merely because Done was clicked.
Bank-provided proof of payment is different from an add-funds request receipt.
No demo webpage content is included in this embed.

<style id="mt-receipt-style">
.mt-r-overlay,.mt-r-overlay *{box-sizing:border-box}
.mt-r-overlay{position:fixed;inset:0;z-index:2147480000;background:rgba(27,23,17,.53);display:none;justify-content:center;align-items:center;padding:12px;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2c2923}
.mt-r-overlay.is-open{display:flex}
.mt-r-paper{position:relative;width:min(100%,410px);height:min(92dvh,790px);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px #0004;outline:none}
.mt-r-scroll{overflow:auto;flex:1;min-height:0;padding:22px 17px 14px;scrollbar-width:thin}
.mt-r-close{display:block;margin:0 0 18px auto;background:none;border:0;color:#38342d;font-size:30px;line-height:1;cursor:pointer;padding:0 6px}
.mt-r-top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 0 27px}
.mt-r-eyebrow{font-size:15px;margin-bottom:5px;color:#51493b}.mt-r-amount{font-size:29px;letter-spacing:-.6px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mt-r-mark{height:46px;width:46px;display:grid;place-items:center;flex:0 0 46px;color:#bd8a15}.mt-r-mark svg{height:42px;width:42px;stroke:currentColor;fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.mt-r-brand{font-weight:800;letter-spacing:.02em;font-size:11px;color:#9c7832;margin:0 0 17px}
.mt-r-row{display:grid;grid-template-columns:99px minmax(0,1fr);gap:12px;border-bottom:1px solid #f0eee8;padding:13px 0;font-size:13px;line-height:1.45;align-items:start}
.mt-r-label{color:#3c3933;font-weight:500}.mt-r-value{color:#2c2923;overflow-wrap:anywhere}.mt-r-primary-value{font-weight:700}.mt-r-sub{font-size:12px;color:#78746b}.mt-r-note{font-size:12px;line-height:1.5;color:#736850;background:#fcf6e9;padding:11px 12px;border-radius:8px;margin:20px 0 4px}
.mt-r-help{width:100%;display:flex;align-items:center;text-align:left;gap:12px;border:0;background:transparent;padding:19px 0;color:#2f2a23;font-size:13px;cursor:pointer}.mt-r-help svg{width:20px;height:20px;stroke:#3b3327;fill:none;stroke-width:1.7;flex-shrink:0}.mt-r-chevron{margin-left:auto;font-size:25px;color:#5b544a}
.mt-r-footer{background:#fff;padding:13px 16px max(16px,env(safe-area-inset-bottom));border-top:1px solid #f4f0e7}.mt-r-share{width:100%;min-height:50px;border:none;border-radius:30px;background:#f7ba27;color:#2b2823;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer}.mt-r-share svg{width:20px;height:20px;stroke:#2b2823;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mt-r-secondary{margin-top:8px;width:100%;background:none;border:0;color:#756647;font-size:12px;padding:5px;cursor:pointer}
@media(max-width:450px){.mt-r-overlay{padding:0}.mt-r-paper{width:100%;height:100dvh;max-height:none;border-radius:0}.mt-r-scroll{padding:21px 16px 12px}.mt-r-top{padding-bottom:24px}}
@media print{body>*:not(#mtReceiptOverlay){display:none!important}.mt-r-overlay{position:static!important;display:block!important;padding:0!important;background:#fff!important}.mt-r-paper{height:auto!important;max-height:none!important;width:100%!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}.mt-r-scroll{overflow:visible!important}.mt-r-close,.mt-r-footer,.mt-r-help{display:none!important}.mt-r-note{print-color-adjust:exact}}
</style>
<div id="mtReceiptOverlay" class="mt-r-overlay" aria-hidden="true">
<section class="mt-r-paper" role="dialog" aria-modal="true" aria-labelledby="mtRTitle" tabindex="-1">
  <div class="mt-r-scroll">
    <button type="button" class="mt-r-close" id="mtRClose" aria-label="Close receipt">×</button>
    <div class="mt-r-top">
      <div><div class="mt-r-eyebrow" id="mtRTitle">Add funds request</div><div class="mt-r-amount" id="mtRAmount">₱0.00</div></div>
      <span class="mt-r-mark" id="mtRMark" aria-hidden="true"></span>
    </div>
    <div class="mt-r-brand">MOM’S TOUCH <span style="color:#c58e10">MEMBERS CLUB</span></div>
    <div class="mt-r-row"><span class="mt-r-label">To</span><span class="mt-r-value"><strong>Mom’s Touch Members Club</strong><br><span class="mt-r-sub">Add Funds</span></span></div>
    <div class="mt-r-row"><span class="mt-r-label">From</span><span class="mt-r-value"><strong id="mtRUserName">—</strong><br><span class="mt-r-sub" id="mtRMethod">Bank transfer</span></span></div>
    <div class="mt-r-row"><span class="mt-r-label">Fee</span><span class="mt-r-value" id="mtRFee">₱0.00</span></div>
    <div class="mt-r-row"><span class="mt-r-label">Total</span><strong class="mt-r-value mt-r-primary-value" id="mtRTotal">₱0.00</strong></div>
    <div class="mt-r-row"><span class="mt-r-label">Status</span><strong class="mt-r-value mt-r-primary-value" id="mtRStatus">Pending verification</strong></div>
    <div class="mt-r-row"><span class="mt-r-label">Reference No.</span><span class="mt-r-value" id="mtRReference">—</span></div>
    <div class="mt-r-row"><span class="mt-r-label">Date</span><span class="mt-r-value" id="mtRDate">—</span></div>
    <div class="mt-r-note" id="mtRNote">This receipt confirms that your add funds request was submitted, not that money has been received.</div>
    <button class="mt-r-help" id="mtRHelp" type="button"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="12" width="4" height="7" rx="1.5"/><rect x="17.5" y="12" width="4" height="7" rx="1.5"/><path d="M20 19a5 5 0 0 1-5 3h-3"/></svg><span>Need help?</span><span class="mt-r-chevron">›</span></button>
  </div>
  <div class="mt-r-footer">
    <button type="button" id="mtRShare" class="mt-r-share"><svg viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 15v5h16v-5"/></svg><span>Share receipt</span></button>
    <button type="button" id="mtRPrint" class="mt-r-secondary">Print / Save as PDF</button>
  </div>
</section>
</div>
<script>
(function(){
'use strict';
const overlay=document.getElementById('mtReceiptOverlay');
const paper=overlay.querySelector('.mt-r-paper');
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(Number(n));
const dateText=d=>{const v=new Date(d);return Number.isNaN(v.getTime())?'—':new Intl.DateTimeFormat('en-PH',{month:'long',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true,timeZone:'Asia/Manila'}).format(v)+' PHT'};
let active=null,lastFocus=null;
const check='<svg viewBox="0 0 48 48"><path d="M8 25l11 11L40 12"/></svg>';
const pending='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M24 13v12l8 5"/></svg>';
const cross='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18"/><path d="M17 17l14 14M31 17L17 31"/></svg>';
function show(data){
 if(!data || !(Number(data.amount)>0) || !Number.isFinite(Number(data.amount)) || !data.userName || !data.referenceNumber || !data.createdAt){console.error('Receipt needs backend-saved amount, userName, referenceNumber and createdAt');return false}
 const status=data.status==='completed'?'completed':data.status==='rejected'?'rejected':'pending';
 const fee=Number.isFinite(Number(data.fee))&&Number(data.fee)>=0?Number(data.fee):0;
 const amount=Number(data.amount);
 const total=amount+fee;
 el('mtRTitle').textContent=status==='completed'?'Paid':status==='rejected'?'Not approved':'Add funds request';
 el('mtRAmount').textContent=money(amount);
 el('mtRUserName').textContent=String(data.userName);
 el('mtRMethod').textContent=data.bank ? String(data.bank) : (data.paymentMethod || 'Bank transfer');
 el('mtRFee').textContent=money(fee);
 el('mtRTotal').textContent=money(total);
 el('mtRReference').textContent=String(data.referenceNumber);
 el('mtRDate').textContent=dateText(data.createdAt);
 el('mtRStatus').textContent={completed:'Paid · Confirmed',pending:'Pending verification',rejected:'Not approved'}[status];
 el('mtRNote').textContent={completed:'Payment was confirmed in the transaction record. Keep this receipt for your records.',pending:'Your add funds request was submitted. Payment must be verified before the amount is credited. This is not proof of a successful transfer.',rejected:'This add funds request was not approved. Please contact support if you need assistance.'}[status];
 el('mtRMark').innerHTML=status==='completed'?check:status==='rejected'?cross:pending;
 active={amount,fee,userName:String(data.userName),bank:data.bank?String(data.bank):'',reference:String(data.referenceNumber),date:dateText(data.createdAt),status:el('mtRStatus').textContent};
 lastFocus=document.activeElement;overlay.classList.add('is-open');overlay.setAttribute('aria-hidden','false');paper.focus();return true;
}
function close(){overlay.classList.remove('is-open');overlay.setAttribute('aria-hidden','true');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function summary(){if(!active)return '';return `MOM'S TOUCH - Add Funds Receipt\nStatus: ${active.status}\nAmount: ${money(active.amount)}\nFrom: ${active.userName}\nBank: ${active.bank}\nFee: ${money(active.fee)}\nTotal: ${money(active.amount+active.fee)}\nReference No.: ${active.reference}\nDate: ${active.date}\n${el('mtRNote').textContent}`}
el('mtRClose').addEventListener('click',close);
el('mtRPrint').addEventListener('click',()=>window.print());
el('mtRShare').addEventListener('click',async()=>{const text=summary();if(!text)return;try{if(navigator.share){await navigator.share({title:"Mom's Touch Add Funds Receipt",text});return}if(navigator.clipboard){await navigator.clipboard.writeText(text);const span=el('mtRShare').querySelector('span');span.textContent='Receipt copied';setTimeout(()=>span.textContent='Share receipt',2000);return}}catch(err){if(err.name==='AbortError')return}window.print()});
el('mtRHelp').addEventListener('click',()=>{if(typeof window.MomsTouchReceipt.onHelp==='function')window.MomsTouchReceipt.onHelp()});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('is-open'))close()});
window.MomsTouchReceipt={show,close,onHelp:null};
})();
</script>
